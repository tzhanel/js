<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOM practice: color picker</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <h2>Color Palette Builder</h2>

    <div class="controls">
      <input type="color" id="color-picker" value="#7f77dd">
      <button id="add-btn">Add color</button>
      <span id="color-count">0 colors saved</span>
    </div>

    <div class="swatch-grid" id="swatch-grid"></div>
  </body>
</html>
